<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARworksite Server</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1f2328;--muted:#6b7078;--line:#e3e1dc;--accent:#d9661f;--accent-ink:#fff;--ok:#2f7d4f;--err:#b3261e;--drop:#fff6ef}
  @media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e8e6e3;--muted:#9aa0a6;--line:#33373c;--accent:#f08a3e;--accent-ink:#1a1a1a;--ok:#6cc58f;--err:#ff8a80;--drop:#2a2420}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:22px;margin:0}
  h1 span{color:var(--accent)}
  header small{color:var(--muted)}
  nav{margin-left:auto;display:flex;gap:4px}
  nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px;font-weight:600}
  nav a:hover{background:var(--card)}
  nav form{margin:0}
  nav .esci{background:transparent;color:var(--muted);font-weight:600;padding:6px 12px;border:0;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
  nav .esci:hover{background:var(--card);color:var(--ink)}
  nav .utente{color:var(--muted);font-size:13px;align-self:center;padding:0 4px 0 10px;border-left:1px solid var(--line)}
  nav a.att{background:var(--card);color:var(--accent);border:1px solid var(--line)}
  section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
  h2{font-size:16px;margin:0 0 14px}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:26px 16px;text-align:center;cursor:pointer;transition:.15s}
  .drop.over,.drop:hover{border-color:var(--accent);background:var(--drop)}
  .drop b{color:var(--accent)}
  .drop p{margin:4px 0;color:var(--muted)}
  #scelti{list-style:none;padding:0;margin:12px 0 0}
  #scelti li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
  #scelti li span:last-child{color:var(--muted);white-space:nowrap}
  .riga{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:14px}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
  label.chk{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
  input[type=text],input[type=password]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:220px}
  button{font:inherit;font-weight:600;padding:9px 18px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
  button:disabled{opacity:.45;cursor:default}
  progress{width:100%;height:8px;margin-top:12px;accent-color:var(--accent)}
  .msg{margin-top:10px;font-size:14px}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
  .tab{width:100%;border-collapse:collapse;font-size:14px}
  .tab th,.tab td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  .tab th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .tab td.num{white-space:nowrap;color:var(--muted)}
  .tab a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
  .vuoto{color:var(--muted);text-align:center;padding:18px}
  .badge{font-size:11px;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
  @media (max-width:640px){.tab .mod{display:none}input[type=text],input[type=password]{min-width:0;width:100%}label{width:100%}}
</style>
</head>
<body>
<main>
  <header>
    <h1>AR<span>worksite</span> Server</h1>
    <small id="ver"></small>
    <nav><a href="/" class="att">Piante</a><a href="/cantieri">Cantieri</a><a href="/attivita">Attività</a><a href="/docs">API</a><span class="utente" id="utente"></span><form method="post" action="/logout"><button class="esci" type="submit">Esci</button></form></nav>
  </header>

  <section id="sez-chiave" hidden>
    <h2>Chiave di accesso</h2>
    <label>Chiave API (X-Api-Key)<input type="password" id="chiave" autocomplete="off"></label>
  </section>

  <section>
    <h2>Aggiungi piante</h2>
    <form id="form">
      <div class="drop" id="drop" tabindex="0">
        <p><b>Trascina qui i file DXF/DWG</b> oppure fai clic per sceglierli</p>
        <p id="limite"></p>
        <input type="file" id="file" accept=".dxf,.dwg" multiple hidden>
      </div>
      <ul id="scelti"></ul>
      <div class="riga">
        <label>Cantiere (cartella)<input type="text" id="cantiere" list="cantieri" placeholder="es. Lungo Avisio"></label>
        <datalist id="cantieri"></datalist>
        <label class="chk"><input type="checkbox" id="sostituisci"> Sostituisci i file con lo stesso nome</label>
        <button type="submit" id="invia" disabled>Carica</button>
      </div>
      <progress id="avanz" max="100" value="0" hidden></progress>
      <div class="msg" id="msg"></div>
    </form>
  </section>

  <section>
    <h2>Piante sul server</h2>
    <table class="tab">
      <thead><tr><th>Cantiere</th><th>File</th><th>Dimensione</th><th class="mod">Modificato</th><th></th></tr></thead>
      <tbody id="elenco"><tr><td colspan="5" class="vuoto">Caricamento…</td></tr></tbody>
    </table>
  </section>
</main>

<script>
const CFG = /*IMPOSTAZIONI*/{};
const $ = id => document.getElementById(id);
let scelti = [];

$("ver").textContent = "v" + CFG.versione;
$("utente").textContent = CFG.utente || "";
const alLogin = () => { location.href = "/login?dopo=/"; };
$("limite").textContent = "Massimo " + CFG.maxMb + " MB per file";
(CFG.cantieri || []).forEach(c => $("cantieri").append(new Option(c)));

if (CFG.chiave) {
  $("sez-chiave").hidden = false;
  try { $("chiave").value = localStorage.getItem("arws-chiave") || ""; } catch (e) {}
  $("chiave").addEventListener("change", () => {
    try { localStorage.setItem("arws-chiave", $("chiave").value); } catch (e) {}
    caricaElenco();
  });
}
const intestazioni = () => CFG.chiave ? { "X-Api-Key": $("chiave").value } : {};

const kb = n => n < 1024 * 1024 ? Math.round(n / 1024).toLocaleString("it-IT") + " KB"
                                 : (n / 1048576).toLocaleString("it-IT", {maximumFractionDigits: 1}) + " MB";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const msg = (testo, tipo) => { $("msg").textContent = testo; $("msg").className = "msg " + (tipo || ""); };

function scegli(lista) {
  const validi = [...lista].filter(f => /\.(dxf|dwg)$/i.test(f.name));
  const scartati = lista.length - validi.length;
  scelti = validi;
  $("scelti").innerHTML = scelti.map(f => `<li><span>${esc(f.name)}</span><span>${kb(f.size)}</span></li>`).join("");
  $("invia").disabled = scelti.length === 0;
  msg(scartati ? `${scartati} file ignorati: sono ammessi solo .dxf e .dwg` : "", scartati ? "err" : "");
}

const drop = $("drop");
drop.addEventListener("click", () => $("file").click());
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
$("file").addEventListener("change", e => scegli(e.target.files));
["dragenter", "dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => scegli(e.dataTransfer.files));

$("form").addEventListener("submit", e => {
  e.preventDefault();
  if (!scelti.length) return;
  const dati = new FormData();
  scelti.forEach(f => dati.append("file", f));
  dati.append("cantiere", $("cantiere").value.trim());
  dati.append("sostituisci", $("sostituisci").checked ? "true" : "false");

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "/api/piante");
  Object.entries(intestazioni()).forEach(([k, v]) => xhr.setRequestHeader(k, v));
  xhr.upload.onprogress = ev => { if (ev.lengthComputable) $("avanz").value = ev.loaded / ev.total * 100; };
  xhr.onload = () => {
    $("avanz").hidden = true; $("invia").disabled = false;
    let r = {}; try { r = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status === 401) { alLogin(); return; }
    if (xhr.status === 201) {
      const n = r.caricate.length;
      msg(n === 1 ? "1 pianta caricata." : n + " piante caricate.", "ok");
      scegli([]); $("file").value = "";
      const c = $("cantiere").value.trim();
      if (c && ![...$("cantieri").options].some(o => o.value === c)) $("cantieri").append(new Option(c));
      caricaElenco();
    } else {
      msg(typeof r.detail === "string" ? r.detail : "Errore " + xhr.status + " durante il caricamento", "err");
    }
  };
  xhr.onerror = () => { $("avanz").hidden = true; $("invia").disabled = false; msg("Server non raggiungibile", "err"); };
  $("avanz").value = 0; $("avanz").hidden = false; $("invia").disabled = true; msg("Caricamento in corso…");
  xhr.send(dati);
});

async function caricaElenco() {
  const corpo = $("elenco");
  try {
    const r = await fetch("/api/piante", { headers: intestazioni() });
    if (r.status === 401) { alLogin(); return; }
    const d = await r.json();
    if (!d.piante.length) { corpo.innerHTML = `<tr><td colspan="5" class="vuoto">Nessuna pianta. Caricane una qui sopra.</td></tr>`; return; }
    corpo.innerHTML = d.piante.map(p => `<tr>
      <td>${esc(p.cantiere || "—")}</td>
      <td>${esc(p.nome)} <span class="badge">${p.formato.toUpperCase()}</span></td>
      <td class="num">${kb(p.dimensione)}</td>
      <td class="num mod">${new Date(p.modificato).toLocaleString("it-IT", {dateStyle: "short", timeStyle: "short"})}</td>
      <td><a data-id="${p.id}" data-nome="${esc(p.nome)}">Scarica</a></td></tr>`).join("");
  } catch (e) {
    corpo.innerHTML = `<tr><td colspan="5" class="vuoto">Impossibile leggere l'elenco.</td></tr>`;
  }
}

$("elenco").addEventListener("click", async e => {
  const a = e.target.closest("a[data-id]");
  if (!a) return;
  const r = await fetch(`/api/piante/${a.dataset.id}/file`, { headers: intestazioni() });
  if (r.status === 401) { alLogin(); return; }
  if (!r.ok) { msg("Download non riuscito (" + r.status + ")", "err"); return; }
  const url = URL.createObjectURL(await r.blob());
  const l = document.createElement("a"); l.href = url; l.download = a.dataset.nome; l.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

caricaElenco();
</script>
</body>
</html>
